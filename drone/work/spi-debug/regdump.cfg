init
halt
echo "\n##### DBGMCU_IDCODE 0x5C001000 (expect DEV_ID 0x483 = STM32H743/753) #####"
mdw 0x5C001000
echo "\n##### SPI1 base 0x40013000 : CR1 CR2 CFG1 CFG2 | IER SR IFCR TXDR | RXDR #####"
mdw 0x40013000 4
mdw 0x40013010 4
mdw 0x40013030 1
echo "\n##### RCC 0x58024400: CR CFGR D1CFGR D2CFGR D2CCIP1R D2CCIP2R PLL2DIVR APB2ENR #####"
mdw 0x58024400 1
mdw 0x58024410 4
mdw 0x58024438 1
mdw 0x58024450 2
mdw 0x580244F0 1
echo "\n##### GPIOB 0x58020400: MODER OTYPER OSPEEDR PUPDR IDR ODR AFRL AFRH #####"
mdw 0x58020400 8
mdw 0x58020420 2
echo "\n##### GPIOA 0x58020000: MODER | AFRL | IDR #####"
mdw 0x58020000 1
mdw 0x58020020 1
mdw 0x58020010 1
echo "\n##### GPIOD 0x58020C00: MODER ODR AFRL #####"
mdw 0x58020C00 1
mdw 0x58020C14 1
mdw 0x58020C20 1
resume
shutdown
